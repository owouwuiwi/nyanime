name: Publish verified Nyanime APKs
run-name: Publish Nyanime ${{ github.event.client_payload.version }} from build ${{ github.event.client_payload.source_run }}
on:
  repository_dispatch:
    types: [publish-nyanime, repair-historical-attribution]
permissions:
  contents: write
concurrency:
  group: public-nyanime-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public documentation only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Publish verified build bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_TOKEN: ${{ secrets.SOURCE_ARTIFACT_TOKEN }}
        run: python3 scripts/publish_release.py
