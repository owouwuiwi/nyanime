android.nonTransitiveRClass=false
android.useAndroidX=true
android.experimental.enableScreenshotTest=true
android.compose.screenshot.maxHeapSize=4g

kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2

org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Preserve existing host plugin APIs with the updated Android toolchain.
android.newDsl=false
android.builtInKotlin=false
# Moko Resources 0.24 uses the legacy generated-source API internally. Its tasks
# still carry their own dependency wiring; our generated sources use Variant API.
android.sourceset.disallowProvider=false
