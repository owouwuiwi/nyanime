[package]
name = "nyanime-source-exchange"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
iroh = "=1.0.0"
iroh-blobs = { version = "=0.103.1", features = ["fs-store"] }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
jni22 = { package = "jni", version = "=0.22.4" }
ndk-context = "0.1"
rustls-platform-verifier = "=0.7.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

